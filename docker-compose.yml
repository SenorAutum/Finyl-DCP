# Finyl-DCP — fully portable stack: PostgreSQL + FastAPI backend + nginx frontend.
# Quickstart:
#   cp .env.example .env        # fill in JWT_SECRET (and LLM_* for the AI agent)
#   docker compose up --build
#   docker compose exec backend python -m app.seeds.seed --force   # demo data
#   open http://localhost:8080  (login: superadmin@finyl.app / Finyl@2026)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finyl_dcp
      POSTGRES_USER: finyl
      POSTGRES_PASSWORD: finyl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finyl -d finyl_dcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides .env so the container talks to the bundled Postgres
      DATABASE_URL: postgresql://finyl:finyl@db:5432/finyl_dcp
      DB_SCHEMA: public
      STORAGE_DIR: /app/storage
    volumes:
      # Uploaded client documents survive container rebuilds
      - docstore:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  docstore:
