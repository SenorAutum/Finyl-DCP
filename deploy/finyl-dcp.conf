# Public URL: https://finyl-dcp.abacusai.cloud  →  server_name finyl-dcp.vm.internal
server {
    listen 80;
    server_name finyl-dcp.vm.internal;

    root /home/ubuntu/finyl-dcp/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # ---------------------------------------------------------------------- #
    # M-Pesa (Daraja) callback webhooks — defence-in-depth source restriction.
    #
    # These paths are UNAUTHENTICATED (Safaricom sends no JWT). Primary source
    # auth is the hard-to-guess secret path token validated in the app
    # (MPESA_CALLBACK_TOKEN). This block is the documented second layer: a
    # Safaricom source-IP allowlist.
    #
    # NOTE: this VM sits behind the platform CDN/edge, so the real client IP
    # arrives in X-Forwarded-For, NOT $remote_addr — enabling a raw `allow/deny`
    # on $remote_addr here would block ALL traffic. To enforce the allowlist in
    # production, terminate at the edge or use ngx_http_realip_module to restore
    # the client IP from X-Forwarded-For, then uncomment the allow/deny list.
    # Safaricom Daraja production egress ranges (confirm current list with
    # Safaricom before enabling):
    #   allow 196.201.214.0/24;
    #   allow 196.201.212.0/24;
    #   allow 196.201.213.0/24;
    #   allow 196.201.211.0/24;
    #   allow 196.201.210.0/24;
    #   deny  all;
    location /api/v1/payments/mpesa/ {
        # set_real_ip_from <edge-cidr>;   # + real_ip_header X-Forwarded-For;  (see note)
        # include /etc/nginx/snippets/daraja-allowlist.conf;   # allow/deny block above
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FastAPI backend
    location /api {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /docs {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $http_x_original_host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $http_x_original_host;
    }
}
