# Checks every pull request and every change to main (WP7, review 7.13).
#
# Before this, the only workflow built AWS infrastructure; nothing ran the
# tests or built the app, so a change that broke them could be merged unseen.
#
#   backend  - the full test suite against a real PostgreSQL 16, then a check
#              that every migration applies cleanly to an empty database.
#   frontend - a production build of the web app.
#
# A red cross on the pull request means: do not merge until it is fixed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finyl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway databases only (tests/conftest.py refuses anything else).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finyl_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run the tests
        run: python -m pytest -q -p no:warnings
      - name: Apply every migration to an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DB_SCHEMA: finyl_ci_migrations
        run: |
          python scripts/run_migrations.py
          python scripts/run_migrations.py   # a second run must change nothing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
